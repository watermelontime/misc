<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ostereier fangen! – Ostern 2026</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="spiel.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="images/icon-192x192.svg">
    <meta name="theme-color" content="#e74c3c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Ostern 2026">
</head>
<body>

<div class="game-scene">

    <!-- Wolken -->
    <div class="cloud" style="--cw:100px; --cloud-speed:45s; top:6%;"><span></span></div>
    <div class="cloud" style="--cw:70px; --cloud-speed:60s; top:14%; animation-delay:-20s;"><span></span></div>
    <div class="cloud" style="--cw:120px; --cloud-speed:55s; top:3%; animation-delay:-35s;"><span></span></div>
    <div class="cloud" style="--cw:80px; --cloud-speed:50s; top:22%; animation-delay:-10s;"><span></span></div>

    <!-- HUD -->
    <div class="hud">
        <div class="score-display">&#129370; Eier: <span id="score-value">0</span></div>
    </div>

    <!-- Leben -->
    <div class="lives-display"></div>

    <!-- Meilenstein-Text -->
    <div id="milestone-text" class="milestone-text"></div>

    <!-- Meilenstein-Buttons (Weiter / Neu) -->
    <div class="milestone-buttons hidden">
        <button id="btn-continue" class="btn-3d">Weiter spielen</button>
        <button id="btn-restart-milestone" class="btn-3d">Neu starten</button>
    </div>

    <!-- Spieler-Hase mit Korb -->
    <div class="player-bunny">
        <svg viewBox="0 0 110 185" xmlns="http://www.w3.org/2000/svg">
            <!-- Korb -->
            <ellipse cx="55" cy="60" rx="42" ry="22" fill="#D2A54C"/>
            <ellipse cx="55" cy="52" rx="40" ry="8" fill="#C49332" />
            <!-- Korbgeflecht -->
            <line x1="25" y1="55" x2="25" y2="78" stroke="#B8860B" stroke-width="1.5"/>
            <line x1="40" y1="52" x2="40" y2="80" stroke="#B8860B" stroke-width="1.5"/>
            <line x1="55" y1="50" x2="55" y2="82" stroke="#B8860B" stroke-width="1.5"/>
            <line x1="70" y1="52" x2="70" y2="80" stroke="#B8860B" stroke-width="1.5"/>
            <line x1="85" y1="55" x2="85" y2="78" stroke="#B8860B" stroke-width="1.5"/>
            <path d="M16,62 Q55,72 94,62" fill="none" stroke="#B8860B" stroke-width="1.5"/>
            <path d="M18,70 Q55,80 92,70" fill="none" stroke="#B8860B" stroke-width="1.5"/>

            <!-- Ohren -->
            <ellipse cx="38" cy="88" rx="8" ry="20" fill="#8B6C42"/>
            <ellipse cx="38" cy="88" rx="4" ry="14" fill="#D4A88C"/>
            <ellipse cx="72" cy="88" rx="8" ry="20" fill="#8B6C42"/>
            <ellipse cx="72" cy="88" rx="4" ry="14" fill="#D4A88C"/>

            <!-- Kopf -->
            <ellipse cx="55" cy="112" rx="22" ry="18" fill="#8B6C42"/>

            <!-- Augen -->
            <circle cx="47" cy="109" r="3.5" fill="#222"/>
            <circle cx="48.2" cy="107.5" r="1.3" fill="#fff"/>
            <circle cx="63" cy="109" r="3.5" fill="#222"/>
            <circle cx="64.2" cy="107.5" r="1.3" fill="#fff"/>

            <!-- Nase -->
            <ellipse cx="55" cy="116" rx="3" ry="2" fill="#E8A0BF"/>

            <!-- Schnurrhaare -->
            <line x1="35" y1="114" x2="47" y2="115" stroke="#666" stroke-width="0.7"/>
            <line x1="35" y1="118" x2="47" y2="117" stroke="#666" stroke-width="0.7"/>
            <line x1="63" y1="115" x2="75" y2="114" stroke="#666" stroke-width="0.7"/>
            <line x1="63" y1="117" x2="75" y2="118" stroke="#666" stroke-width="0.7"/>

            <!-- Körper -->
            <ellipse cx="55" cy="142" rx="22" ry="18" fill="#8B6C42"/>

            <!-- Pfoten links / rechts (halten den Korb) -->
            <ellipse cx="18" cy="68" rx="8" ry="6" fill="#A07850"/>
            <ellipse cx="92" cy="68" rx="8" ry="6" fill="#A07850"/>

            <!-- Beine -->
            <ellipse cx="43" cy="158" rx="10" ry="7" fill="#8B6C42"/>
            <ellipse cx="67" cy="158" rx="10" ry="7" fill="#8B6C42"/>

            <!-- Füße -->
            <ellipse cx="40" cy="166" rx="14" ry="6" fill="#A07850"/>
            <ellipse cx="70" cy="166" rx="14" ry="6" fill="#A07850"/>

            <!-- Bauchfell -->
            <ellipse cx="55" cy="145" rx="13" ry="11" fill="#C4A672" opacity="0.45"/>
        </svg>
    </div>

    <!-- Start-Overlay -->
    <div class="start-overlay">
        <h1>&#127873; Ostereier fangen!</h1>
        <button id="btn-start" class="btn-3d" style="font-size:1.5rem; padding:18px 44px;">
            &#9654; Start
        </button>
    </div>

    <!-- Game Over Overlay -->
    <div class="gameover-overlay hidden">
        <h1>Game Over</h1>
        <div class="final-score">Du hast <span id="final-score">0</span> Eier gefangen!</div>
        <button id="btn-restart-gameover" class="btn-3d">Neu starten</button>
    </div>

    <!-- Zurück-Button -->
    <a href="index.html" class="back-button">&#8592; Zurück</a>

</div>

<script src="config.js"></script>
<script src="spiel.js"></script>

<!-- Service Worker Registration -->
<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('service-worker.js');
    }
</script>

</body>
</html>
