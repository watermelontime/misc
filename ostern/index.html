<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ostern 2026</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="titel.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="images/icon-192x192.svg">
    <meta name="theme-color" content="#e74c3c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Ostern 2026">
</head>
<body>

<div class="werkstatt">

    <!-- Frohe Ostern -->
    <div class="frohe-ostern" id="frohe-ostern">
        <div class="frohe-ostern-line1"></div>
        <div class="frohe-ostern-line2"></div>
    </div>

    <!-- Boden -->
    <div class="floor"></div>

    <!-- Regale -->
    <div class="shelf shelf-left"></div>
    <div class="shelf shelf-right"></div>
    <div class="shelf shelf-center"></div>

    <!-- Schrank -->
    <div class="schrank">
        <div class="schrank-door schrank-door-left"></div>
        <div class="schrank-door schrank-door-right"></div>
    </div>

    <!-- Tisch -->
    <div class="table"></div>

    <!-- Farbeimer -->
    <div class="bucket bucket-red bucket-1"></div>
    <div class="bucket bucket-blue bucket-2"></div>
    <div class="bucket bucket-yellow bucket-3"></div>
    <div class="bucket bucket-green bucket-4"></div>

    <!-- Pinsel in Bechern auf Regalen -->
    <div class="brush-cup brush-cup-1">
        <div class="cup-brush" style="--b-color:#e74c3c; --b-rot:-8deg; --b-left:15%"></div>
        <div class="cup-brush" style="--b-color:#3498db; --b-rot:6deg; --b-left:55%"></div>
    </div>
    <div class="brush-cup brush-cup-2">
        <div class="cup-brush" style="--b-color:#2ecc71; --b-rot:-5deg; --b-left:10%"></div>
        <div class="cup-brush" style="--b-color:#f1c40f; --b-rot:8deg; --b-left:45%"></div>
        <div class="cup-brush" style="--b-color:#9b59b6; --b-rot:-3deg; --b-left:70%"></div>
    </div>
    <div class="brush-cup brush-cup-3">
        <div class="cup-brush" style="--b-color:#e67e22; --b-rot:5deg; --b-left:20%"></div>
        <div class="cup-brush" style="--b-color:#e74c3c; --b-rot:-7deg; --b-left:60%"></div>
    </div>
    <div class="brush-cup brush-cup-4">
        <div class="cup-brush" style="--b-color:#3498db; --b-rot:4deg; --b-left:15%"></div>
        <div class="cup-brush" style="--b-color:#2ecc71; --b-rot:-6deg; --b-left:55%"></div>
    </div>
    <div class="brush-cup brush-cup-5">
        <div class="cup-brush" style="--b-color:#f1c40f; --b-rot:-4deg; --b-left:10%"></div>
        <div class="cup-brush" style="--b-color:#e67e22; --b-rot:7deg; --b-left:45%"></div>
        <div class="cup-brush" style="--b-color:#9b59b6; --b-rot:0deg; --b-left:75%"></div>
    </div>

    <!-- Osterhase -->
    <div class="bunny-container" role="img" aria-label="Osterhase – klicke auf den Kopf!">
        <svg class="bunny-svg" viewBox="0 0 200 360" xmlns="http://www.w3.org/2000/svg">
            <!-- Ohren -->
            <g class="ear-left" style="transform-origin: 72px 95px;">
                <ellipse cx="72" cy="50" rx="18" ry="50" fill="#8B6C42"/>
                <ellipse cx="72" cy="50" rx="10" ry="40" fill="#D4A88C"/>
            </g>
            <g class="ear-right" style="transform-origin: 128px 95px;">
                <ellipse cx="128" cy="50" rx="18" ry="50" fill="#8B6C42"/>
                <ellipse cx="128" cy="50" rx="10" ry="40" fill="#D4A88C"/>
            </g>

            <!-- Kopf -->
            <ellipse cx="100" cy="115" rx="42" ry="38" fill="#8B6C42"/>

            <!-- Augen -->
            <circle cx="85" cy="108" r="6" fill="#222"/>
            <circle cx="87" cy="105" r="2.5" fill="#fff"/>
            <circle cx="115" cy="108" r="6" fill="#222"/>
            <circle cx="117" cy="105" r="2.5" fill="#fff"/>

            <!-- Nase -->
            <ellipse cx="100" cy="122" rx="5" ry="3.5" fill="#E8A0BF"/>

            <!-- Schnurrhaare -->
            <line x1="60" y1="118" x2="85" y2="120" stroke="#555" stroke-width="1"/>
            <line x1="60" y1="125" x2="85" y2="124" stroke="#555" stroke-width="1"/>
            <line x1="115" y1="120" x2="140" y2="118" stroke="#555" stroke-width="1"/>
            <line x1="115" y1="124" x2="140" y2="125" stroke="#555" stroke-width="1"/>

            <!-- Mund -->
            <path d="M93,130 Q100,137 107,130" fill="none" stroke="#555" stroke-width="1.2"/>

            <!-- Körper -->
            <ellipse cx="100" cy="230" rx="55" ry="75" fill="#8B6C42"/>

            <!-- Schürze – Nackenband -->
            <path d="M75,170 Q100,160 125,170" fill="none" stroke="#D4C5A0" stroke-width="3" stroke-linecap="round"/>
            <!-- Schürze – Brustlatz -->
            <path d="M72,172 L66,198 L134,198 L128,172 Q100,163 72,172Z" fill="#F5F0E1" stroke="#E8DCC8" stroke-width="0.8"/>
            <!-- Schürze – Hauptteil -->
            <path d="M56,198 L60,282 Q100,290 140,282 L144,198Z" fill="#F5F0E1" stroke="#E8DCC8" stroke-width="0.8"/>
            <!-- Schürze – Taillenband -->
            <path d="M56,198 L144,198" fill="none" stroke="#D4C5A0" stroke-width="3"/>
            <!-- Schürze – Seitenbänder -->
            <path d="M56,198 Q42,196 38,201" fill="none" stroke="#D4C5A0" stroke-width="3" stroke-linecap="round"/>
            <path d="M144,198 Q158,196 162,201" fill="none" stroke="#D4C5A0" stroke-width="3" stroke-linecap="round"/>
            <!-- Schürze – Schleife -->
            <path d="M38,201 Q30,206 28,198 Q27,192 33,194" fill="none" stroke="#D4C5A0" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M162,201 Q170,206 172,198 Q173,192 167,194" fill="none" stroke="#D4C5A0" stroke-width="2.5" stroke-linecap="round"/>
            <!-- Schürze – Tasche -->
            <path d="M78,232 L78,264 Q100,270 122,264 L122,232Z" fill="#EDE5D0" stroke="#D4C5A0" stroke-width="0.8"/>
            <line x1="100" y1="232" x2="100" y2="266" stroke="#D4C5A0" stroke-width="0.5"/>
            <!-- Farbkleckse auf Schürze -->
            <circle cx="82"  cy="212" r="6"  fill="#e74c3c" opacity="0.8"/>
            <circle cx="118" cy="210" r="5"  fill="#3498db" opacity="0.8"/>
            <circle cx="132" cy="248" r="7"  fill="#f1c40f" opacity="0.75"/>
            <circle cx="85"  cy="252" r="5"  fill="#2ecc71" opacity="0.8"/>
            <circle cx="115" cy="275" r="4"  fill="#9b59b6" opacity="0.7"/>
            <circle cx="68"  cy="270" r="4"  fill="#e67e22" opacity="0.7"/>

            <!-- Arme -->
            <ellipse cx="50" cy="220" rx="18" ry="12" fill="#8B6C42" transform="rotate(-20, 50, 220)"/>
            <ellipse cx="150" cy="220" rx="18" ry="12" fill="#8B6C42" transform="rotate(20, 150, 220)"/>

            <!-- Pfoten (Hände) -->
            <ellipse cx="38" cy="215" rx="9" ry="7" fill="#A07850"/>
            <ellipse cx="162" cy="215" rx="9" ry="7" fill="#A07850"/>

            <!-- Beine -->
            <ellipse cx="78" cy="312" rx="22" ry="16" fill="#8B6C42"/>
            <ellipse cx="122" cy="312" rx="22" ry="16" fill="#8B6C42"/>

            <!-- Füße (realistisch) -->
            <path d="M45,330 Q50,318 72,316 Q94,318 99,330 Q100,340 92,346 Q82,352 72,352 Q62,352 52,346 Q44,340 45,330Z" fill="#A07850"/>
            <ellipse cx="58" cy="342" rx="7" ry="4" fill="#C4A880" opacity="0.5"/>
            <ellipse cx="72" cy="344" rx="7" ry="4" fill="#C4A880" opacity="0.5"/>
            <ellipse cx="86" cy="342" rx="7" ry="4" fill="#C4A880" opacity="0.5"/>
            <path d="M101,330 Q106,318 128,316 Q150,318 155,330 Q156,340 148,346 Q138,352 128,352 Q118,352 108,346 Q100,340 101,330Z" fill="#A07850"/>
            <ellipse cx="114" cy="342" rx="7" ry="4" fill="#C4A880" opacity="0.5"/>
            <ellipse cx="128" cy="344" rx="7" ry="4" fill="#C4A880" opacity="0.5"/>
            <ellipse cx="142" cy="342" rx="7" ry="4" fill="#C4A880" opacity="0.5"/>

            <!-- Bauchfell -->
            <ellipse cx="100" cy="240" rx="28" ry="35" fill="#C4A672" opacity="0.4"/>
        </svg>
    </div>

    <!-- Spielen-Button -->
    <div class="play-button-wrapper">
        <a href="spiel.html" class="btn-3d">&#127912; Spielen</a>
    </div>

</div>

<script src="config.js"></script>
<script src="titel.js"></script>

<!-- Service Worker Registration -->
<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('service-worker.js');
    }
</script>

</body>
</html>
