    <rect x="205" y="185" width="40" height="40" fill="#00e5ff" transform="rotate(-6 225 205)"/>
    <rect x="262" y="183" width="40" height="40" fill="#ffd23f" transform="rotate(6 282 203)"/>
    <rect x="318" y="198" width="40" height="40" fill="#7c4dff" transform="rotate(18 338 218)"/>
    <rect x="135" y="258" width="42" height="42" fill="#2bff88" transform="rotate(-10 156 279)"/>
    <rect x="196" y="248" width="42" height="42" fill="#ff6a00" transform="rotate(-3 217 269)"/>
    <rect x="258" y="247" width="42" height="42" fill="#ff3ca6" transform="rotate(3 279 268)"/>
    <rect x="320" y="256" width="42" height="42" fill="#00e5ff" transform="rotate(10 341 277)"/>
    <rect x="150" y="318" width="42" height="42" fill="#ffd23f" transform="rotate(-14 171 339)"/>
    <rect x="208" y="312" width="42" height="42" fill="#7c4dff" transform="rotate(-4 229 333)"/>
    <rect x="266" y="312" width="42" height="42" fill="#2bff88" transform="rotate(4 287 333)"/>
    <rect x="322" y="320" width="42" height="42" fill="#ff6a00" transform="rotate(14 343 341)"/>
    <rect x="186" y="372" width="40" height="40" fill="#00e5ff" transform="rotate(-8 206 392)"/>
    <rect x="246" y="376" width="40" height="40" fill="#ff3ca6" transform="rotate(2 266 396)"/>
    <rect x="300" y="372" width="40" height="40" fill="#ffd23f" transform="rotate(10 320 392)"/>
  </g>
  <!-- grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.25" stroke-width="2" fill="none">
    <circle cx="256" cy="300" r="150"/>
    <ellipse cx="256" cy="300" rx="150" ry="55"/>
    <ellipse cx="256" cy="300" rx="150" ry="110"/>
    <ellipse cx="256" cy="300" rx="55" ry="150"/>
    <ellipse cx="256" cy="300" rx="110" ry="150"/>
  </g>
  <!-- sparkle -->
  <circle cx="200" cy="245" r="10" fill="#ffffff" opacity="0.9"/>
