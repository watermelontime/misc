<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#2a1a4a"/>
      <stop offset="100%" stop-color="#0d0821"/>
    </radialGradient>
    <radialGradient id="ball" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#c8d6ff"/>
      <stop offset="100%" stop-color="#5566aa"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- hanger -->
  <rect x="250" y="48" width="12" height="60" rx="6" fill="#8a7fb0"/>
  <circle cx="256" cy="44" r="12" fill="#b9aee0"/>
  <!-- disco ball -->
  <circle cx="256" cy="300" r="150" fill="url(#ball)"/>
  <!-- colorful facets -->
